<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Virtuous Human</title>
<meta name="description" content="You become what you do every day. Phase, Field and Gain: body, mind and money.">
<meta name="theme-color" content="#06050A">
<meta property="og:title" content="You become what you do every day.">
<meta property="og:image" content="icons/phase.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/phase.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="poster">
  <h1>You become<br>what you do<br>every day.</h1>
  <canvas id="days" role="img" aria-label="Days, more of them kept as time goes on"></canvas>
  <footer>
    <nav class="apps" aria-label="The apps">
      <a href="support/" title="Phase · body · in beta"><img src="icons/phase.png" alt="Phase, for your body. In beta."></a>
      <a title="Field · mind · next"><img src="icons/field.png" alt="Field, for your mind. Next."></a>
      <a title="Gain · money · later"><img src="icons/gain.png" alt="Gain, for your money. Later."></a>
    </nav>
    <nav class="links"><a href="privacy/">Privacy</a><a href="support/">Support</a></nav>
  </footer>
</main>
<script>
// Days, filling the space. Left to right they light up; further right, more of them are kept.
(() => {
  const c = document.getElementById('days'), g = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let seeds = [], cols = 0, rows = 0, cell = 0, start = 0;
  function layout() {
    const dpr = Math.min(devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr;
    cell = Math.max(10, Math.min(18, w / 64)) * dpr;
    cols = Math.floor(c.width / cell); rows = Math.max(1, Math.floor(c.height / cell));
    let s = 11; const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
    seeds = Array.from({ length: cols * rows }, () => rand());
  }
  function draw(t) {
    const r = cell * 0.26, ox = (c.width - cols * cell) / 2, oy = (c.height - rows * cell) / 2;
    const front = still ? cols + 1 : Math.min(cols + 1, (t - start) / 22);   // columns lit so far
    g.clearRect(0, 0, c.width, c.height);
    for (let x = 0; x < cols; x++) {
      const keep = 0.18 + 0.72 * (x / Math.max(1, cols - 1));
      for (let y = 0; y < rows; y++) {
        const kept = seeds[x * rows + y] < keep && x < front;
        g.fillStyle = kept ? '#C9B8FF' : '#1C1A24';
        g.beginPath(); g.arc(ox + (x + .5) * cell, oy + (y + .5) * cell, r, 0, 7); g.fill();
      }
    }
    if (front <= cols) requestAnimationFrame(draw);
  }
  const go = () => { layout(); start = performance.now() + 300; requestAnimationFrame(draw); };
  addEventListener('resize', () => { layout(); draw(Infinity); });
  document.fonts ? document.fonts.ready.then(go) : go();
})();
</script>
</body>
</html>
